[package]
name = "solana-mev-searcher"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "searcher"
path = "src/main.rs"

[dependencies]
solana-sdk = "=5.0.0"
yellowstone-grpc-client = "=14.0.1"
yellowstone-grpc-proto = { version = "=13.0.0", default-features = false, features = ["tonic"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net", "fs", "io-util"] }
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
clap = { version = "4.6.7", features = ["derive"] }
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
zeroize = "1.9.0"
rpassword = "7.5.4"
rand = "0.10.3"
bs58 = "0.5.1"
base64 = "0.23.1"
mimalloc = { version = "0.1.52", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
